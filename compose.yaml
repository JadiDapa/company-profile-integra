services:
  postgres:
    image: postgres:16
    container_name: integra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: daffa
      POSTGRES_PASSWORD: daffa2004
      POSTGRES_DB: integra
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daffa -d integra"]
      interval: 5s
      timeout: 5s
      retries: 5

  nextjs:
    build: .
    container_name: integra_nextjs
    env_file:
      - .env.production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media_data:/app/media

volumes:
  postgres_data:
  media_data:
